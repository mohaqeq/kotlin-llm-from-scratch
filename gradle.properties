org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# No build cache: small modules, and a learner must always see the tests run.
org.gradle.caching=false
kotlin.code.style=official
# No Kotlin incremental compilation: both modes compile in the same tasks, and stale
# incremental state after a mode switch gave wrong class files. The modules are small.
kotlin.incremental=false
